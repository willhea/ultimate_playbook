# Weekly dependency updates as pull requests into main, grouped so there are few of them.
# Each one runs the full test suite before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /play-animator
    target-branch: main
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    ignore:
      # Pinned to match the browser in cloud sessions and the CI container (see docs/plan.md).
      - dependency-name: '@playwright/test'
      # typescript-eslint doesn't support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
