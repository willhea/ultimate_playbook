name: Ultimate Playbook

# Every pull request runs the checks (even docs-only ones, so required checks on
# `main` never wait forever), and so does every change that lands on `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # The official image for the pinned Playwright version has the matching Chromium and
    # system libraries, so tests run on exactly the browser build used during development.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 14

  build:
    name: Build the app
    # Each change that lands on main, once the tests pass, produces a downloadable copy of
    # the app: one self-contained HTML file that opens in any browser.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build:single
      - uses: actions/upload-artifact@v5
        with:
          name: ultimate-playbook-${{ github.sha }}
          path: app/dist-single/index.html
          retention-days: 90

  deploy:
    name: Publish to GitHub Pages
    # Each change that lands on main, once the tests pass, goes live at
    # https://willhea.github.io/ultimate_playbook/ (Settings → Pages → Source: GitHub Actions).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
