<text x="30" y="440" font-size="13" fill="#333">Scene: O1 has the disc (white) and is marked by D1. O3 cuts under toward the open side while D3 trails. O4 waits deep, guarded by D4.</text>
<text x="30" y="458" font-size="13" fill="#333">Facing is automatic: moving players face where they run, defenders face their player, idle offense faces the disc.</text>
